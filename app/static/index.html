<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页 - AI 模拟面试</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav>
    <a href="/" class="active">个人主页</a>
    <a href="/knowledge.html">题库管理</a>
    <a href="/interview.html">模拟面试</a>
    <a href="/settings.html">设置</a>
  </nav>
  <main>
    <h1>个人主页</h1>

    <div class="stats-cards">
      <div class="stat"><div class="num" id="statAnswered">-</div><div class="lbl">累计答题</div></div>
      <div class="stat"><div class="num" id="statInterviews">-</div><div class="lbl">面试次数</div></div>
      <div class="stat"><div class="num" id="statAvg">-</div><div class="lbl">总平均贴合度</div></div>
    </div>

    <div class="card">
      <h2>板块能力画像</h2>
      <div id="categories"><div class="none-hint">暂无数据，请先进行模拟面试</div></div>
    </div>

    <div class="card">
      <h2>薄弱板块</h2>
      <div id="weak"><div class="none-hint">暂无数据</div></div>
    </div>

    <div class="card">
      <h2>学习优化建议</h2>
      <div class="warning" id="adviceWarning" hidden></div>
      <div class="advice" id="advice">暂无数据，请先进行模拟面试</div>
    </div>

    <div class="card">
      <h2>历史面试</h2>
      <div id="history"><div class="none-hint">暂无面试记录</div></div>
    </div>
  </main>

  <div id="reportModal" class="modal" hidden>
    <div class="modal-box">
      <h2>面试报告</h2>
      <div id="reportBody"></div>
      <button onclick="document.getElementById('reportModal').hidden = true">关闭</button>
    </div>
  </div>

  <script>
    async function api(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.statusText);
      return res.json();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      ));
    }

    function fmtDate(d) {
      if (!d) return '-';
      return new Date(d).toLocaleString('zh-CN', { hour12: false });
    }

    function barColor(score) {
      if (score >= 80) return '#34c759';
      if (score >= 60) return '#ff9500';
      return '#ff3b30';
    }

    async function loadOverview() {
      const o = await api('/api/profile/overview');
      document.getElementById('statAnswered').textContent = o.stats.answered;
      document.getElementById('statInterviews').textContent = o.stats.interviews;
      document.getElementById('statAvg').textContent = o.stats.avg_all == null ? '-' : o.stats.avg_all;

      if (o.categories.length) {
        document.getElementById('categories').innerHTML = o.categories.map(c => `
          <div class="cat-row">
            <div class="cat-name">${esc(c.category)}</div>
            <div class="cat-bar"><div class="cat-fill" style="width:${c.avg_score}%;background:${barColor(c.avg_score)}"></div></div>
            <div class="cat-score">${c.avg_score} 分 · ${c.count} 题</div>
          </div>`).join('');
      }

      if (o.weak.length) {
        document.getElementById('weak').innerHTML =
          '<div class="weak-tags">' + o.weak.map(w =>
            `<span class="weak-tag">${esc(w.category)}（${w.avg_score} 分）</span>`).join('') + '</div>';
      }

      document.getElementById('advice').textContent = o.advice;
      const adviceWarning = document.getElementById('adviceWarning');
      adviceWarning.textContent = o.advice_warning || '';
      adviceWarning.hidden = !o.advice_warning;
    }

    async function loadHistory() {
      const list = await api('/api/interview/history');
      if (!list.length) return;
      document.getElementById('history').innerHTML = list.map(h => `
        <div class="history-item" onclick="openReport(${h.id})">
          <div>
            <div class="date">面试 #${h.id} · ${fmtDate(h.created_at)}</div>
            <div class="info">已答 ${h.answered} 题${h.avg_score != null ? ' · 平均 ' + h.avg_score + ' 分' : ''}${h.status === 'completed' ? '' : ' · 进行中'}</div>
          </div>
          <div style="color:#0071e3;font-size:13px;">查看报告 →</div>
        </div>`).join('');
    }

    async function openReport(id) {
      const r = await api('/api/interview/' + id + '/report');
      let items = r.items.map(it => `
        <div class="report-item">
          <div class="q">${esc(it.question)}</div>
          <span class="score">${it.score} 分</span>
          <span style="font-size:12px;color:#6e6e73;">${esc(it.category)}</span>
          ${(it.strengths && it.strengths.length) ? '<div class="ok">优点<ul>' + it.strengths.map(s => `<li>${esc(s)}</li>`).join('') + '</ul></div>' : ''}
          ${(it.weaknesses && it.weaknesses.length) ? '<div class="warn">不足<ul>' + it.weaknesses.map(s => `<li>${esc(s)}</li>`).join('') + '</ul></div>' : ''}
          ${it.suggestion ? `<div>建议：${esc(it.suggestion)}</div>` : ''}
          ${it.standard_answer ? `<div class="std">标准答案：${esc(it.standard_answer)}</div>` : ''}
        </div>`).join('');
      const warning = r.summary_warning
        ? `<div class="warning">${esc(r.summary_warning)}</div>` : '';
      document.getElementById('reportBody').innerHTML =
        `<div style="margin-bottom:8px;font-size:14px;">平均贴合度 <b>${r.avg_score}</b> 分 · 共 ${r.answered} 题</div>
         ${warning}
         <div class="report-summary">${esc(r.summary)}</div>${items}`;
      document.getElementById('reportModal').hidden = false;
    }

    loadOverview();
    loadHistory();
  </script>
</body>
</html>
