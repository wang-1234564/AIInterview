# Alembic configuration.
# The database URL and target metadata are supplied by alembic/env.py from the
# application config (.env DATABASE_URL), so no sqlalchemy.url is set here to
# avoid maintaining it in two places.
# NOTE: keep this file ASCII-only; Alembic reads it with the system locale
# encoding on Windows.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
